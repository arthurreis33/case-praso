<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="V1 da plataforma de campo · instrumento de pesquisa do case RevOps Praso">
  <title>Campo Praso · V1</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topo">
    <a href="#/" class="marca"><span>Campo&nbsp;<b>V1</b></span></a>
    <span id="aviso-armazenamento" class="ponto-status" title="armazenamento"></span>
    <button type="button" class="btn-export" data-acao="abrir-export">Exportar</button>
  </header>

  <div id="avisos"></div>
  <main id="app" tabindex="-1"></main>
  <nav id="barra" class="barra"></nav>

  <dialog id="dlg-export">
    <form method="dialog" class="dlg">
      <h2>Exportar e backup</h2>
      <p id="export-resumo" class="sutil"></p>
      <div class="pilha">
        <button type="button" class="btn grande" data-acao="baixar-csv">Baixar CSV (planilha)</button>
        <button type="button" class="btn grande" data-acao="baixar-json">Baixar JSON (completo)</button>
        <button type="button" class="btn" data-acao="compartilhar-json" id="btn-compartilhar" hidden>Compartilhar JSON…</button>
      </div>
      <details class="mais">
        <summary>Mais opções</summary>
        <div class="pilha">
          <label class="btn">Importar backup JSON<input type="file" accept="application/json,.json" id="inp-importar" hidden></label>
          <button type="button" class="btn" data-acao="carregar-exemplo">Carregar pontos fictícios de exemplo</button>
          <button type="button" class="btn" data-acao="remover-exemplo">Remover pontos fictícios</button>
        </div>
      </details>
      <button class="btn fechar" value="fechar">Fechar</button>
    </form>
  </dialog>

  <script type="module" src="js/app.js"></script>
</body>
</html>
