<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="Plataforma de campo Praso · V2 · protótipo do case RevOps">
  <title>Campo Praso · V2</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topo">
    <button type="button" id="btn-voltar" class="btn-voltar" aria-label="Voltar" hidden>
      <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M15 18l-6-6 6-6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <a href="#/hoje" class="marca" aria-label="Campo Praso V2, ir para Hoje"><span>Campo&nbsp;<b>V2</b></span></a>
    <span id="relogio-sim" class="relogio-sim" hidden></span>
    <button type="button" id="status-fila" class="status" data-acao="abrir-fila" aria-label="Situação do armazenamento e da fila">
      <span class="ponto-status" aria-hidden="true"></span><span id="status-fila-n" class="fila-n"></span>
    </button>
    <a href="#/sim" class="btn-sim" aria-label="Simulador de eventos (desenvolvedor)" title="Simulador">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M19.4 13a7.5 7.5 0 0 0 0-2l2.1-1.6-2-3.5-2.5 1a7.6 7.6 0 0 0-1.7-1L15 3h-4l-.4 2.9a7.6 7.6 0 0 0-1.7 1l-2.5-1-2 3.5L6.6 11a7.5 7.5 0 0 0 0 2l-2.1 1.6 2 3.5 2.5-1a7.6 7.6 0 0 0 1.7 1L11 21h4l.4-2.9a7.6 7.6 0 0 0 1.7-1l2.5 1 2-3.5ZM13 15.5A3.5 3.5 0 1 1 13 8.5a3.5 3.5 0 0 1 0 7Z"/></svg>
    </a>
    <button type="button" class="btn-export" data-acao="abrir-export">Exportar</button>
  </header>

  <div id="avisos"></div>
  <main id="app" tabindex="-1"><p class="carregando">Abrindo…</p></main>
  <div id="barra" class="barra"></div>
  <nav id="abas" class="abas" aria-label="Navegação principal">
    <a href="#/hoje" data-aba="hoje"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3v2M17 3v2M4 8h16M5 5h14a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1Zm3 7h3v3H8z"/></svg><span>Hoje</span></a>
    <a href="#/mapa" data-aba="mapa"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2Zm0 0v14m6-12v14"/></svg><span>Mapa</span></a>
    <a href="#/carteira" data-aba="carteira"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16M6 10h12M8 15h8M10 20h4"/></svg><span>Carteira</span></a>
    <a href="#/painel" data-aba="painel"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10m6 10V4m6 16v-7m4 7H3"/></svg><span>Painel</span></a>
  </nav>

  <dialog id="dlg-export">
    <form method="dialog" class="dlg">
      <h2>Exportar e backup</h2>
      <p id="export-resumo" class="sutil"></p>
      <div class="pilha">
        <button type="button" class="btn grande" data-acao="baixar-csv">Baixar CSV (visitas)</button>
        <button type="button" class="btn grande" data-acao="baixar-json">Baixar JSON (completo)</button>
        <button type="button" class="btn" data-acao="compartilhar-csv" data-compartilhar hidden>Compartilhar CSV…</button>
        <button type="button" class="btn" data-acao="compartilhar-json" data-compartilhar hidden>Compartilhar JSON…</button>
      </div>
      <p class="sutil">O formato é compatível com a V1: as colunas da V1 vêm primeiro, na mesma ordem.</p>
      <details class="mais">
        <summary>Mais opções</summary>
        <div class="pilha">
          <label class="btn">Importar backup JSON (V1 ou V2)<input type="file" accept="application/json,.json" id="inp-importar" hidden></label>
          <button type="button" class="btn" data-acao="carregar-exemplo">Carregar dados fictícios da demo</button>
          <button type="button" class="btn" data-acao="remover-exemplo">Remover dados fictícios</button>
        </div>
      </details>
      <button class="btn fechar" value="fechar">Fechar</button>
    </form>
  </dialog>

  <dialog id="dlg-confirmar">
    <form method="dialog" class="dlg">
      <h2 id="confirmar-titulo">Confirmar</h2>
      <p id="confirmar-texto"></p>
      <div class="linha-btns">
        <button class="btn grande" value="nao">Cancelar</button>
        <button class="btn primaria grande" value="sim" id="confirmar-sim">Confirmar</button>
      </div>
    </form>
  </dialog>

  <script type="module" src="js/app.js"></script>
</body>
</html>
