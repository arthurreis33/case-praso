<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2053CE">
  <meta name="description" content="Campo Praso: rota do dia, visitas e carteira do vendedor">
  <title>Campo Praso</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="img/icone-192.png" type="image/png">
  <link rel="apple-touch-icon" href="img/icone-180.png">
  <link rel="preload" href="fonts/inter-latin-wght.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topo">
    <button type="button" id="btn-voltar" class="btn-voltar" aria-label="Voltar" hidden>
      <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M15 18l-6-6 6-6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <a href="#/hoje" class="marca" aria-label="Praso Campo, ir para Hoje"><img src="img/logo-praso.png" alt="Praso" width="100" height="30"><span class="sub-marca">Campo</span></a>
    <span id="relogio-sim" class="relogio-sim" hidden></span>
    <button type="button" id="status-fila" class="status" data-acao="abrir-fila" aria-label="Situação do armazenamento e da fila">
      <span class="ponto-status" aria-hidden="true"></span><span id="status-fila-n" class="fila-n"></span>
    </button>
    <a href="#/perfil" id="btn-perfil" class="btn-perfil" aria-label="Perfil: rota, backup e ajustes">
      <svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="10" r="3.2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M6.8 18.6a6 6 0 0 1 10.4 0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <span id="perfil-alerta" class="perfil-alerta" hidden></span>
    </a>
  </header>

  <div id="avisos"></div>
  <main id="app" tabindex="-1"><p class="carregando">Abrindo…</p></main>
  <div id="barra" class="barra"></div>
  <nav id="abas" class="abas" aria-label="Navegação principal">
    <a href="#/hoje" data-aba="hoje"><svg class="ic" aria-hidden="true"><use href="#i-hoje"></use></svg><span>Hoje</span></a>
    <a href="#/mapa" data-aba="mapa"><svg class="ic" aria-hidden="true"><use href="#i-mapa"></use></svg><span>Mapa</span></a>
    <a href="#/carteira" data-aba="carteira"><svg class="ic" aria-hidden="true"><use href="#i-carteira"></use></svg><span>Carteira</span></a>
    <a href="#/painel" data-aba="painel" aria-label="Semana: seus pontos e seu funil"><svg class="ic" aria-hidden="true"><use href="#i-semana"></use></svg><span>Semana</span></a>
  </nav>

  <dialog id="dlg-confirmar">
    <form method="dialog" class="dlg">
      <h2 id="confirmar-titulo">Confirmar</h2>
      <p id="confirmar-texto"></p>
      <div class="linha-btns">
        <button class="btn grande" value="nao">Cancelar</button>
        <button class="btn primaria grande" value="sim" id="confirmar-sim">Confirmar</button>
      </div>
    </form>
  </dialog>

  <script type="module" src="js/app.js"></script>
</body>
</html>
